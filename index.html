<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#154734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PolyPark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>PolyPark Prototype</title>
<style>
  :root {
    --green: #154734; --green-dark: #0c3023; --gold: #f0ab00; --ink: #222; --muted: #787c80;
    --paper: #f6f7f4; --line: #dee0dc; --open: #dff0d8; --taken: #e2e2e2; --danger: #a4262c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink);
    background: #e9ece8; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .phone {
    width: 390px; height: min(844px, calc(100vh - 56px)); background: var(--paper); border: 11px solid #1c1c1e;
    border-radius: 52px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  #screen { height: 100%; display: flex; flex-direction: column; }
  .caption { font-size: 12px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 480px) {
    body { background: var(--paper); justify-content: flex-start; }
    .phone { width: 100%; height: 100%; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    .caption { display: none; }
  }

  /* brand banner and title bar */
  .brand { flex: none; display: flex; align-items: center; gap: 11px; color: #fff; padding: calc(20px + env(safe-area-inset-top)) 18px 11px;
    background: linear-gradient(135deg, #1b5a42 0%, var(--green) 45%, var(--green-dark) 100%); border-bottom: 4px solid var(--gold); }
  .brand .word { font-size: 23px; font-weight: 800; letter-spacing: -.3px; line-height: 1; }
  .brand .word span { color: var(--gold); }
  .brand .tagline { font-size: 10.5px; letter-spacing: .9px; text-transform: uppercase; opacity: .85; margin-top: 4px; }
  .brand .chip { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--green-dark); background: var(--gold); border-radius: 12px; padding: 4px 10px; white-space: nowrap; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 11px 20px; flex: none; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; }
  header .back { background: none; border: 0; color: var(--green); font-size: 28px; padding: 0 8px 3px 0; cursor: pointer; line-height: 1; }
  header .clock { margin-left: auto; background: #eef2ee; border: 0; border-radius: 10px; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--green); padding: 6px 10px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .clock.hint { animation: hint 1.8s ease-out infinite; }
  @keyframes hint { 0% { box-shadow: 0 0 0 0 rgba(240,171,0,.75); } 100% { box-shadow: 0 0 0 10px rgba(240,171,0,0); } }
  main { flex: 1; overflow-y: auto; padding: 18px 20px 24px; -webkit-overflow-scrolling: touch; }
  main.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  /* tab bar */
  nav { flex: none; display: flex; background: #fff; border-top: 1px solid var(--line); padding: 8px 0 calc(14px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; background: none; border: 0; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 0; position: relative; }
  nav button svg { display: block; width: 24px; height: 24px; margin: 0 auto 4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { color: var(--green); font-weight: 700; }
  nav button.on svg { fill: rgba(21,71,52,.12); }
  nav button .badge { position: absolute; top: 0; left: 50%; margin-left: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); border: 2px solid #fff; }

  /* common pieces */
  h2 { font-size: 17px; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  button.row { width: 100%; text-align: left; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  button.row:hover, button.row:focus-visible { border-color: var(--green); background: #eef4ef; outline: none; }
  .row .name { font-weight: 700; font-size: 17px; }
  .where { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .row .count { margin-left: auto; font-weight: 700; font-size: 15px; color: var(--green); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  .row .count.full { color: var(--muted); }
  .chev { color: var(--muted); font-size: 20px; }
  .tag { display: inline-block; background: #fdf0cd; color: #8c6000; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 9px; margin-left: 6px; vertical-align: 2px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--green); background: #e3efe6; border-radius: 10px; padding: 3px 9px; margin-left: 8px; vertical-align: 2px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #2e9e5b; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--green); cursor: pointer; margin-top: 10px; }
  .btn:active { background: var(--green-dark); transform: scale(.985); }
  .btn:disabled { background: #bcc4be; cursor: default; transform: none; }
  .btn.ghost { background: #fff; color: var(--green); border: 1px solid var(--line); font-size: 16px; }
  .btn.danger { background: #fff; color: var(--danger); border: 1px solid var(--line); font-size: 16px; }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .demo { display: block; margin: 16px auto 0; background: none; border: 0; font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .notice { background: #fdf0cd; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  button.notice { border: 0; width: 100%; text-align: left; font: inherit; font-size: 14px; cursor: pointer; }
  .center { text-align: center; }
  .big { font-size: 26px; font-weight: 700; margin: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* find a spot */
  .quick { width: 100%; text-align: left; font: inherit; cursor: pointer; border: 0; color: #fff; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #1b5a42, var(--green-dark)); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .quick b { display: block; font-size: 16px; } .quick span span { font-size: 13px; opacity: .85; }
  .quick .go { margin-left: auto; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 13px; border-radius: 10px; padding: 7px 12px; white-space: nowrap; }
  .map { border-radius: 16px; position: relative; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 7 / 6; background: #f1f0e3; touch-action: none; user-select: none; -webkit-user-select: none; }
  .drive .map { aspect-ratio: 7 / 5; }
  .cmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; --u: 1; cursor: grab; }
  .cmap:active { cursor: grabbing; }
  .cmap path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* colors follow the official Cal Poly campus map: cream land, gray buildings, white roads */
  .cmap .m-land { fill: #f1f0e3; }
  .cmap .m-green { fill: #cfe0b4; } .cmap .m-pitch { fill: #a9cf8e; stroke: #97c27b; stroke-width: .5; }
  .cmap .m-farm { fill: #e4e9cf; } .cmap .m-wood { fill: #c6dcae; }
  .cmap .m-water { fill: #7fcbf2; } .cmap .m-stream { stroke: #9ed4ef; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .cmap .m-parking { fill: #e4e4e2; stroke: #c9c9c6; stroke-width: .5; }
  .cmap .m-bldg { fill: #e2e1dd; stroke: #cfcec9; stroke-width: .5; }
  .cmap .m-foot { stroke: #fbfaf4; stroke-width: 1; }
  .cmap .m-ped { stroke: #f0b47c; stroke-width: 1.2; stroke-dasharray: 3.5 2.5; stroke-linecap: butt; }
  .cmap .m-aisle { stroke: rgba(255,255,255,.85); stroke-width: 1.3; pointer-events: none; }
  .cmap .m-svc.c { stroke: #cfcfca; stroke-width: 3.6; } .cmap .m-svc.f { stroke: #fff; stroke-width: 2.6; }
  .cmap .m-minor.c { stroke: #c9c9c4; stroke-width: 5.8; } .cmap .m-minor.f { stroke: #fff; stroke-width: 4.6; }
  .cmap .m-major.c { stroke: #c4c4bf; stroke-width: 7.4; } .cmap .m-major.f { stroke: #fff; stroke-width: 6; }
  .cmap .m-trunk.c { stroke: #d8b56a; stroke-width: 9.5; } .cmap .m-trunk.f { stroke: #fdf0c4; stroke-width: 7.8; }
  .cmap .m-rail.c { stroke: #a9a9a6; stroke-width: 2.6; stroke-linecap: butt; } .cmap .m-rail.f { stroke: #f1f0e3; stroke-width: 1.2; stroke-linecap: butt; }
  /* parking is the subject of this map, so lots carry the strongest color on it */
  .cmap .m-halo { stroke: #2e9e5b; stroke-opacity: .28; stroke-width: calc(var(--u) * 11px); }
  .cmap .m-halo.low { stroke: #f0ab00; stroke-opacity: .34; } .cmap .m-halo.full { stroke: #8a8a8a; stroke-opacity: .2; } .cmap .m-halo.hot { stroke: #f0ab00; stroke-opacity: .5; }
  .cmap .m-lot { fill: #2e9e5b; stroke: #14532d; stroke-width: 2.2; cursor: pointer; transition: fill .4s, stroke .4s; }
  .cmap .m-lot.low { fill: #f0ab00; stroke: #8a6100; }
  .cmap .m-lot.full { fill: #9c9c9a; stroke: #5f5f5d; }
  .cmap .m-lot.hot { fill: #154734; stroke: #f0ab00; stroke-width: 3; }
  .cmap .m-oth { fill: #b7c8ec; stroke: #4f6fb8; stroke-width: 1.3; cursor: pointer; }
  .cmap text { font-family: inherit; text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: rgba(255,255,255,.9); stroke-linejoin: round; pointer-events: none; }
  .cmap .m-rl { font-size: calc(var(--u) * 9.5px); stroke-width: calc(var(--u) * 2.8px); letter-spacing: calc(var(--u) * .7px); fill: #4d4d4b; font-weight: 500; }
  .cmap .m-wl { font-size: calc(var(--u) * 9px); stroke-width: calc(var(--u) * 2.4px); letter-spacing: calc(var(--u) * .7px); fill: #3f8fc0; font-style: italic; }
  .cmap .m-xl { font-size: calc(var(--u) * 8.5px); stroke-width: calc(var(--u) * 2.4px); fill: #6d6d6a; }
  .cmap .m-bl { font-size: calc(var(--u) * 9px); stroke-width: calc(var(--u) * 2.6px); fill: #6b6b68; font-weight: 500; }
  .cmap .m-pl { font-size: calc(var(--u) * 9px); stroke-width: calc(var(--u) * 2.8px); fill: #27488f; font-weight: 700; }
  .cmap .rt-base { stroke: #154734; stroke-opacity: .28; stroke-width: calc(var(--u) * 5px); stroke-dasharray: calc(var(--u) * 1px) calc(var(--u) * 9px); }
  .cmap .rt-done { stroke: #154734; stroke-width: calc(var(--u) * 5px); }
  .mapctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .mapctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.95); font: inherit; font-size: 19px; font-weight: 700; color: var(--green); cursor: pointer; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .mapctl.bl { top: auto; right: auto; left: 8px; bottom: 8px; }
  .mapcredit.tr { left: auto; bottom: auto; right: 6px; top: 4px; }
  .mapcredit { position: absolute; left: 6px; bottom: 4px; font-size: 9px; color: #5d635f; background: rgba(255,255,255,.7); border-radius: 4px; padding: 1px 5px; pointer-events: none; }
  .map button.pin { position: absolute; left: 0; top: 0; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 15px; border: 2px solid #fff; background: #1f8a4c; color: #fff; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; transition: background .4s; will-change: transform; }
  .map button.pin.low { background: var(--gold); color: var(--ink); }
  .map button.pin.full { background: #6f6f6d; }
  .map button.pin.pref { box-shadow: 0 0 0 2px var(--green), 0 2px 6px rgba(0,0,0,.35); }
  .maplegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 7px 2px 2px; }
  .maplegend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .mapnote { font-size: 11px; color: var(--muted); margin: 3px 2px 16px; }

  /* spot picker */
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
  .grid button { aspect-ratio: 7 / 8; border-radius: 9px; border: 2px solid transparent; font: inherit; font-weight: 700; font-size: 15px; transition: background .35s, color .35s; }
  .grid button.open { background: var(--open); color: var(--green); cursor: pointer; }
  .grid button.open:hover { border-color: var(--green); }
  .grid button.taken { background: var(--taken); color: #a5a5a5; }
  .grid button.pick { background: var(--gold); border-color: #aa7600; color: var(--ink); }
  .grid button.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(240,171,0,.9); transform: scale(1.12); } 100% { box-shadow: 0 0 0 12px rgba(240,171,0,0); transform: none; } }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

  /* reserved */
  .timer { font-size: 42px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; margin: 2px 0; }
  .ring { position: relative; width: 216px; height: 216px; margin: 6px auto 8px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .track { stroke: #e3e8e3; }
  .ring .bar { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .3s; }
  .ring .bar.low { stroke: var(--danger); }
  .ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .burst i { position: absolute; width: 9px; height: 9px; border-radius: 2px; background: var(--gold); opacity: 0; animation: burst 1s ease-out forwards; }
  .burst i:nth-child(odd) { background: #2e9e5b; border-radius: 50%; }
  @keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(-90px) scale(.4); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-170px) scale(1.1); } }
  .check { width: 92px; height: 92px; border-radius: 50%; background: var(--green); margin: 14px auto 16px; display: flex; align-items: center; justify-content: center; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .check svg { width: 50px; height: 50px; fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .25s ease-out forwards; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* drive */
  .drive .map { margin-bottom: 14px; }
  .drive .step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .drive .step:first-child { border-top: 0; }
  .drive .step i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #e3e8e3; color: var(--muted); font-style: normal; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .drive .step.now { color: var(--ink); font-weight: 700; }
  .drive .step.now i { background: var(--gold); color: var(--ink); }
  .drive .step.done i { background: var(--green); color: #fff; }
  .eta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .eta b { font-size: 30px; color: var(--green); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* permit and account */
  .plate { font-family: ui-monospace, Menlo, monospace; font-weight: 700; background: #f1f1ee; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .line:first-of-type { border-top: 0; }
  .line .grow { flex: 1; }
  .mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; font: inherit; font-size: 13px; padding: 5px 9px; cursor: pointer; color: var(--green); white-space: nowrap; }
  .mini:disabled { color: #bbb; cursor: default; }
  input[type=text] { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; width: 100%; margin-top: 8px; }

  /* staff */
  .util .bar { height: 10px; background: #e3e8e3; border-radius: 5px; overflow: hidden; margin: 9px 0 6px; }
  .util .bar i { display: block; height: 100%; background: var(--green); border-radius: 5px; transition: width .5s, background .5s; }
  .util .bar i.hot { background: var(--danger); }
  .util .bar i.warm { background: var(--gold); }
  .util .top { display: flex; align-items: baseline; gap: 8px; }
  .util .top b { font-size: 17px; } .util .top span { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart { width: 100%; height: auto; display: block; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .key i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }

  /* login */
  .login { flex: 1; background: linear-gradient(160deg, #1b5a42, var(--green) 40%, var(--green-dark)); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 30px; text-align: center; }
  .login h1 { font-size: 42px; margin: 10px 0 6px; letter-spacing: -.5px; }
  .login h1 span { color: var(--gold); }
  .login p { opacity: .85; margin: 0 0 36px; }
  .login .btn.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
  .login .logo { animation: drop .7s cubic-bezier(.2,1.5,.4,1); }
  @keyframes drop { from { transform: translateY(-40px); opacity: 0; } }

  /* overlays */
  .sheet { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; animation: fade .15s ease-out; z-index: 5; }
  .sheet.light { background: rgba(0,0,0,.12); }
  .sheet > div { background: #fff; width: 100%; border-radius: 22px 22px 0 0; padding: 22px 20px calc(26px + env(safe-area-inset-bottom)); animation: rise .22s ease-out; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  .sheet h2 { font-size: 19px; margin-bottom: 8px; }
  .sheet p { font-size: 15px; margin: 0 0 6px; }
  @keyframes fade { from { opacity: 0; } } @keyframes rise { from { transform: translateY(40px); } }
  input[type=range] { width: 100%; accent-color: var(--green); margin: 10px 0 2px; height: 28px; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .simtime { font-size: 30px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
  .toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: #1c1c1e; color: #fff; font-size: 14px; border-radius: 12px; padding: 12px 14px; text-align: center; animation: rise .2s ease-out; box-shadow: 0 6px 18px rgba(0,0,0,.3); z-index: 6; }
  #note { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 9; pointer-events: none; }
  .note { pointer-events: auto; display: flex; gap: 11px; align-items: center; background: rgba(250,250,248,.97); border-radius: 18px; padding: 11px 13px; box-shadow: 0 10px 30px rgba(0,0,0,.28); font-size: 13.5px; cursor: pointer; animation: slide .35s cubic-bezier(.2,1.2,.4,1); }
  .note.out { transition: transform .3s, opacity .3s; transform: translateY(-120%); opacity: 0; }
  .note .ic { flex: none; width: 38px; height: 38px; border-radius: 9px; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .note b { display: block; font-size: 14px; }
  .note small { margin-left: auto; align-self: flex-start; color: var(--muted); font-size: 11px; }
  @keyframes slide { from { transform: translateY(-120%); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="phone" id="phone"><div id="screen"></div><div id="overlay"></div><div id="note"></div></div>
<div class="caption">PolyPark prototype · BUS 3394 · sample data only · tap the clock for demo controls · R resets · F skips the hold ahead 5 minutes</div>

function save() {
  try {
    const { signedIn, role, view, simMin, preferred, reservation, vehicles, seenDemo } = S;
    localStorage.setItem(STORE, JSON.stringify({ signedIn, role, view: view === 'drive' || view === 'lot' ? 'find' : view,
      simMin, preferred, reservation, vehicles, seenDemo, closed: S.lots.filter(l => l.closed).map(l => l.id) }));
  } catch (e) { /* storage unavailable: the prototype still works */ }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d) return;
    const { closed = [], ...rest } = d;
    Object.assign(S, rest);
    S.lots.forEach(l => { l.closed = closed.includes(l.id); });
    if (S.reservation && !S.reservation.arrived && S.reservation.endsAt < Date.now()) S.reservation = null;
  } catch (e) { /* ignore a damaged save */ }
}

    ${['green', 'pitch', 'farm', 'wood', 'water', 'stream', 'parking', 'bldg', 'foot', 'ped'].map(k => path('m-' + k, k)).join('')}
    ${roads.map(k => path(`m-${k} c`, k)).join('')}${roads.map(k => path(`m-${k} f`, k)).join('')}${path('m-rail c', 'rail')}${path('m-rail f', 'rail')}
    ${OTHER_LOTS.map(o => `<path class="m-oth" data-act="otherlot" data-id="${o.t}" d="${o.d}"/>`).join('')}
    ${Object.entries(MAP.lots).map(([id, l]) => `<path class="m-halo" data-halo="${id}" d="${l.d}"/>`).join('')}
    ${Object.entries(MAP.lots).map(([id, l]) => `<path class="m-lot" data-act="lot" data-id="${id}" d="${l.d}"/>`).join('')}
    ${path('m-aisle', 'aisle')}
    <g id="routeg"></g>
    ${MAP.labels.map((l, i) => `<text class="${LABEL_CLASS[l.k]}" data-li="${i}" x="${l.x}" y="${l.y}"${l.a ? ` transform="rotate(${l.a} ${l.x} ${l.y})"` : ''}>${esc(l.t)}</text>`).join('')}
    ${OTHER_LOTS.map((o, i) => `<text class="m-pl" data-on="${i}" x="${o.x}" y="${o.y}">${esc(o.t)}</text>`).join('')}
  </svg>`;

    ...MAP.labels.map((l, i) => ({ el: svg.querySelector(`[data-li="${i}"]`), kind: l.k, x: l.x, y: l.y, a: l.a || 0, chars: l.t.length })),
    ...OTHER_LOTS.map((o, i) => ({ el: svg.querySelector(`[data-on="${i}"]`), kind: 'pl', x: o.x, y: o.y, a: 0, chars: o.t.length })),

let lastGrid = { id: null, taken: new Set() };
function lotScreen() {
  const l = lot(S.lotId);
  const taken = takenSet(l);
  const my = mine(l);
  const fresh = lastGrid.id === l.id ? n => taken.has(n) !== lastGrid.taken.has(n) : () => false;
  const cells = ALL.map(n => {
    const isTaken = taken.has(n) || l.closed;
    const cls = n === S.pick || n === my ? 'pick' : isTaken ? 'taken' : 'open';
    return `<button class="${cls}${fresh(n) ? ' flash' : ''}" ${isTaken || n === my ? 'disabled' : `data-act="pick" data-id="${n}"`}>${n}</button>`;
  }).join('');
  lastGrid = { id: l.id, taken };
  let action;
  if (l.closed) {
    action = `<div class="notice"><b>Closed today for an event.</b> Parking Services has closed this lot. Try another lot.</div>`;
  } else if (S.reservation) {
    action = `<div class="notice">You already have a reservation. PolyPark holds one spot at a time.</div>
      <button class="btn" data-act="tab" data-id="reserve">View my reservation</button>`;
  } else if (!openCount(l)) {
    action = `<div class="notice">This lot is full. Try another lot.</div>`;
  } else if (!reservationsOpen()) {
    action = `<div class="notice"><b>Reservations open at 5:00 AM.</b> It is ${simClock()} on campus.</div>`;
  } else {
    action = `<div class="card"><h2>${S.pick ? 'Spot ' + S.pick : 'No spot chosen'}</h2>
        <p class="sub" style="margin:0">Held for 30 minutes after you reserve.<br>The sensor confirms when you arrive.</p></div>
      <button class="btn" data-act="reserve" ${S.pick ? '' : 'disabled'}>${S.pick ? 'Reserve spot ' + S.pick : 'Choose a spot'}</button>`;
  }
  const sub = l.closed ? 'Closed today for an event' : `${openCount(l)} of ${l.spaces} open · showing the 24 spots nearest the entrance`;
  return header(l.name, 'find') + `<main><h2>Choose a spot</h2>
    <p class="sub">${sub}</p>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--open)"></i>Open</span><span><i style="background:var(--taken)"></i>Taken</span>
      <span><i style="background:var(--gold)"></i>Your pick</span></div>${action}</main>` + tabs('find');
}

function reserveScreen() {
  const r = S.reservation;
  if (!r) {
    return header('My reservation') + `<main class="center"><div style="height:60px"></div>
      <p class="big">No spot reserved</p><p class="sub" style="margin-top:8px">Reserve a spot before you leave for campus.<br>Reservations open at 5:00 AM each day.</p>
      <button class="btn" data-act="tab" data-id="find">Find a spot</button></main>` + tabs('reserve');
  }
  const l = lot(r.lotId);
  if (r.arrived) {
    return header('Parked') + `<main class="center"><div class="check"><svg viewBox="0 0 50 50"><path d="M11 26l10 10 18-21"/></svg></div>
      <p class="big">You're parked</p><p class="sub" style="margin-top:6px">Spot ${r.spot} · ${l.name}<br>The spot's sensor confirmed your arrival.</p>
      <div class="card" style="text-align:left"><div class="line"><span class="grow">Permit</span><b>Student Commuter</b></div>
        <div class="line"><span class="grow">Vehicle</span><span class="plate">${esc(S.vehicles[0].plate)}</span></div>
        <div class="line"><span class="grow">Arrived</span><b>${simClock(r.arrivedSim)}</b></div></div>
      <button class="btn ghost" data-act="leave">I've left the spot</button></main>` + tabs('reserve');
  }
  const burst = S.celebrate ? `<div class="burst">${Array.from({ length: 14 }, (_, i) => `<i style="--a:${i * 25.7}deg;animation-delay:${(i % 4) * 40}ms"></i>`).join('')}</div>` : '';
  return header('Reserved') + `<main class="center">
    <p class="big">Spot ${r.spot} is yours</p><p class="sub" style="margin-top:4px">${l.name} · ${l.where}</p>
    <div class="ring">${burst}<svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="88"/>
        <circle class="bar ${remaining() <= 300 ? 'low' : ''}" id="bar" cx="100" cy="100" r="88" stroke-dasharray="${RING}" stroke-dashoffset="${S.celebrate ? RING : ringOffset()}"/></svg>
      <div class="in"><div class="sub" style="margin:0">Held for</div><div class="timer" id="timer">${fmt(remaining())}</div>
        <div class="sub" style="margin:0">Until ${simClock(r.simEnd)}</div></div></div>
    <button class="btn" data-act="drive">Get directions</button>
    <button class="btn danger" data-act="sheet" data-id="cancel">Cancel reservation</button>
    <button class="demo" data-act="skip">Demo control: skip ahead 5 minutes</button></main>` + tabs('reserve');
}

function driveSteps(l, r) {
  return [`Enter campus on ${l.road}`, l.turn, `Spot ${r.spot} is in row ${Math.ceil(r.spot / 6)}. Look for the green light`];
}
function driveScreen() {
  const r = S.reservation, l = lot(r.lotId);
  const steps = driveSteps(l, r).map((s, i) => `<div class="step${i === 0 ? ' now' : ''}" data-step="${i}"><i>${i + 1}</i><span>${s}</span></div>`).join('');
  return header('Directions', 'reserve') + `<main class="drive">
    <div class="map"><div class="mapctl"><button data-act="zoom" data-id="in" aria-label="Zoom in">+</button><button data-act="zoom" data-id="out" aria-label="Zoom out">−</button></div>
      <span class="mapcredit">© OpenStreetMap contributors</span></div>
    <div class="eta"><b id="eta">…</b><span class="sub" style="margin:0">to spot ${r.spot}, ${l.name} · hold ends ${simClock(r.simEnd)}</span></div>
    <div class="card">${steps}</div>
    <button class="btn ghost" data-act="arrive">Skip the drive: I'm at the spot</button></main>` + tabs('reserve');
}
let driveToken = 0;
function startDrive() {
  const path = document.getElementById('route'), car = document.getElementById('car'), eta = document.getElementById('eta');
  if (!path) return;
  const len = path.getTotalLength(), token = ++driveToken, t0 = performance.now();
  const minutes = Math.max(1, Math.round(len * MAP.mPerUnit / 400));   // about 15 mph on campus
  path.style.strokeDasharray = len;
  const stepEls = [...screenEl.querySelectorAll('.step')];
  const frame = now => {
    if (token !== driveToken || S.view !== 'drive' || !document.body.contains(path)) return;
    const p = Math.min(1, (now - t0) / DRIVE_MS);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const pt = path.getPointAtLength(len * e);
    car.setAttribute('transform', `translate(${pt.x} ${pt.y}) scale(${mapEl.style.getPropertyValue('--u') || 1})`);
    path.style.strokeDashoffset = len * (1 - e);
    const mins = Math.ceil(minutes * (1 - e));
    eta.textContent = mins > 0 ? `${mins} min` : 'Arriving';
    const at = e < 0.5 ? 0 : e < 0.9 ? 1 : 2;
    stepEls.forEach((el, i) => { el.className = 'step' + (i < at ? ' done' : i === at ? ' now' : ''); });
    if (p < 1) requestAnimationFrame(frame);
    else setTimeout(() => { if (token === driveToken && S.view === 'drive') { actions.arrive(); save(); } }, 700);
  };
  requestAnimationFrame(frame);
}

function permitScreen() {
  const cars = S.vehicles.map((v, i) => `<div class="line"><span class="plate">${esc(v.plate)}</span><span class="grow">${esc(v.car)}</span>
      <button class="mini" data-act="removecar" data-id="${i}" ${S.vehicles.length === 1 ? 'disabled' : ''}>Remove</button></div>`).join('');
  const add = S.adding
    ? `<div class="card"><h2>Add a vehicle</h2>
        <input type="text" id="plate" placeholder="License plate" maxlength="8" autocomplete="off" autocapitalize="characters">
        <input type="text" id="car" placeholder="Color, make and model" maxlength="40" autocomplete="off">
        <button class="btn" data-act="savecar">Save vehicle</button><button class="btn ghost" data-act="canceladd">Cancel</button></div>`
    : `<button class="btn ghost" data-act="addcar" ${S.vehicles.length >= 3 ? 'disabled' : ''}>
        ${S.vehicles.length >= 3 ? 'Three vehicles registered (the limit)' : 'Add a vehicle'}</button>`;
  return header('My permit') + `<main>
    <div class="card" style="background:linear-gradient(135deg,#1b5a42,var(--green-dark));color:#fff;border:0">
      <div style="font-size:12px;opacity:.8">2026–27 SCHOOL YEAR</div>
      <div style="font-size:22px;font-weight:700;margin:4px 0">Student Commuter Permit</div>
      <div style="font-size:14px">Active through June 2027</div></div>
    <h2 style="margin-top:18px">Registered vehicles</h2><p class="sub">Your license plate is your permit. Up to three vehicles.</p>
    <div class="card">${cars}</div>${add}</main>` + tabs('permit');
}

function accountScreen() {
  const staff = S.role === 'staff';
  const rows = S.preferred.map((id, i) => `<div class="line"><b style="width:18px">${i + 1}</b><span class="grow">${lot(id).name}</span>
      <button class="mini" data-act="up" data-id="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move ${lot(id).name} up">▲</button>
      <button class="mini" data-act="down" data-id="${i}" ${i === S.preferred.length - 1 ? 'disabled' : ''} aria-label="Move ${lot(id).name} down">▼</button></div>`).join('');
  const prefs = staff ? '' : `<h2 style="margin-top:18px">Preferred lots</h2><p class="sub">Ranked lots appear first when you look for a spot</p><div class="card">${rows}</div>`;
  return header('Account') + `<main><div class="card"><div style="font-weight:700;font-size:17px">${staff ? 'Sample Staff Member' : 'Sample Student'}</div>
      <div class="where">${staff ? 'Parking Services · signed in with Cal Poly' : 'Signed in with Cal Poly'}</div></div>${prefs}
    <button class="btn ghost" data-act="signout">Log out</button>
    <button class="demo" data-act="sheet" data-id="demo">Demo controls</button></main>` + tabs('account');
}

// ---------- Parking Services screen
function utilScreen() {
  const now = S.simMin / 60;
  const used = l => (l.closed ? 0 : l.spaces - openCount(l));
  const total = S.lots.reduce((a, l) => a + l.spaces, 0), inUse = S.lots.reduce((a, l) => a + used(l), 0);
  const full = S.lots.filter(l => !l.closed && !openCount(l)).length;
  const X = h => 28 + (h - 4.5) / 6.5 * 300, Y = o => 104 - o * 92;
  const lines = S.lots.map(l => `<polyline fill="none" stroke="${l.color}" stroke-width="2.2" stroke-linejoin="round" points="${
    Array.from({ length: 53 }, (_, i) => 4.5 + i * 0.125).map(h => `${X(h).toFixed(1)},${Y(occupancy(l, h)).toFixed(1)}`).join(' ')}"/>`).join('');
  const hours = [5, 6, 7, 8, 9, 10, 11].map(h => `<text x="${X(h)}" y="118" font-size="8" text-anchor="middle" fill="#787c80">${h}</text>`).join('');
  const cards = S.lots.map(l => {
    const pct = l.closed ? 0 : Math.round(100 * used(l) / l.spaces);
    return `<div class="card"><div class="top"><b>${l.name}</b><span>${l.closed ? 'Closed' : pct + '%'}</span></div>
      <div class="bar"><i class="${pct >= 98 ? 'hot' : pct >= 85 ? 'warm' : ''}" style="width:${pct}%"></i></div>
      <div class="line" style="border:0;padding:0"><span class="grow where" style="margin:0">${l.closed ? 'Closed today for an event' : `${used(l)} of ${l.spaces} in use · ${openCount(l)} open`}</span>
        <button class="mini" data-act="toggle" data-id="${l.id}">${l.closed ? 'Reopen' : 'Close for event'}</button></div></div>`;
  }).join('');
  return header('Lot utilization') + `<main class="util">
    <div class="card"><div class="top"><b>Commuter parking</b><span>${Math.round(100 * inUse / total)}% in use</span></div>
      <p class="sub" style="margin:4px 0 8px">${full} of ${S.lots.length} lots full at ${simClock()} · ${total - inUse} spaces open</p>
      <svg class="chart" viewBox="0 0 340 122" role="img" aria-label="Share of each lot in use through the morning">
        <g stroke="#e3e8e3"><line x1="28" x2="328" y1="${Y(1)}" y2="${Y(1)}"/><line x1="28" x2="328" y1="${Y(.5)}" y2="${Y(.5)}"/><line x1="28" x2="328" y1="${Y(0)}" y2="${Y(0)}"/></g>
        <text x="24" y="${Y(1) + 3}" font-size="8" text-anchor="end" fill="#787c80">100%</text><text x="24" y="${Y(.5) + 3}" font-size="8" text-anchor="end" fill="#787c80">50%</text>
        ${lines}${hours}<line x1="${X(now)}" x2="${X(now)}" y1="8" y2="106" stroke="#222" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="${X(now)}" cy="8" r="3" fill="#222"/></svg>
      <div class="key">${S.lots.map(l => `<span><i style="background:${l.color}"></i>${l.short || l.name}</span>`).join('')}<span>· hour of the morning</span></div></div>
    <h2 style="margin-top:16px">Lots<span class="live"><i></i>Live</span></h2><p class="sub">Close a lot for an event and permit holders see it right away.</p>${cards}</main>` + tabs('util');
}

// ---------- overlays
function sheet() {
  const r = S.reservation;
  if (S.sheet === 'cancel' && r) {
    return `<div class="sheet"><div><h2>Cancel this reservation?</h2>
      <p>Spot ${r.spot} goes back to the open pool right away.</p>
      <button class="btn danger" data-act="cancelres">Yes, cancel it</button><button class="btn ghost" data-act="closesheet">Keep my spot</button></div></div>`;
  }
  if (S.sheet === 'expired') {
    return `<div class="sheet"><div><h2>Your hold ended</h2><p>The 30 minutes passed, so the spot went back to the open pool.</p>
      <button class="btn" data-act="closesheet">OK</button></div></div>`;
  }
  if (S.sheet === 'demo') {
    return `<div class="sheet light" data-act="backdrop"><div>
      <h2>Demo controls</h2><p class="sub" style="margin-bottom:6px">Move the campus clock and watch the lots fill.</p>
      <div class="simtime" id="simtime">${simClock()}</div>
      <input type="range" id="sim" min="270" max="660" step="1" value="${Math.min(660, S.simMin)}" aria-label="Campus time">
      <div class="ticks"><span>4:30 AM</span><span>7:00</span><span>9:00</span><span>11:00 AM</span></div>
      ${r && !r.arrived ? '<button class="btn ghost" data-act="skip">Skip my hold ahead 5 minutes</button>' : ''}
      <button class="btn ghost" data-act="switch">${S.role === 'staff' ? 'Switch to the permit holder app' : 'Switch to the Parking Services view'}</button>
      <button class="btn ghost" data-act="reset">Reset the prototype</button>
      <button class="btn" data-act="closesheet">Done</button></div></div>`;
  }
  return '';
}

let lastView = null;
function renderScreen() {
  const screens = { find: findScreen, lot: lotScreen, reserve: reserveScreen, drive: driveScreen, permit: permitScreen, account: accountScreen, util: utilScreen };
  if (S.signedIn && S.view === 'drive' && (!S.reservation || S.reservation.arrived)) S.view = 'reserve';
  const old = screenEl.querySelector('main');
  const scroll = old ? old.scrollTop : 0;
  screenEl.innerHTML = S.signedIn ? screens[S.view]() : loginScreen();
  const main = screenEl.querySelector('main');
  const key = S.signedIn ? S.view + (S.view === 'lot' ? S.lotId : '') + (S.view === 'reserve' && S.reservation ? (S.reservation.arrived ? 'p' : 'r') : '') : 'login';
  if (main && key !== lastView) main.classList.add('enter');
  else if (main) main.scrollTop = scroll;
  lastView = key;
  if (S.signedIn && (S.view === 'find' || S.view === 'drive')) mountMap(S.view);
  if (S.view === 'drive' && S.signedIn) startDrive();
  if (S.celebrate) {
    S.celebrate = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const bar = document.getElementById('bar');
      if (bar && S.reservation) bar.setAttribute('stroke-dashoffset', ringOffset());
    }));
  }
}
function renderOverlay() {
  overlayEl.innerHTML = (S.signedIn && S.toast && !S.sheet ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '') + (S.signedIn ? sheet() : '');
}
function render() { renderScreen(); renderOverlay(); }

// ---------- actions
const actions = {
  signin: role => { S.signedIn = true; S.role = role; go(role === 'staff' ? 'util' : 'find'); },
  signout: () => { S.signedIn = false; S.sheet = null; S.pick = null; render(); },
  switch: () => { S.role = S.role === 'staff' ? 'holder' : 'staff'; go(S.role === 'staff' ? 'util' : 'find'); },
  tab: id => go(id, { pick: null }),
  lot: id => { if (S.view !== 'drive') go('lot', { lotId: id, pick: null }); },
  otherlot: name => { if (S.view === 'find') { toast(`${name} needs a different permit. Yours covers the commuter lots`); renderOverlay(); } },
  zoom: id => {
    const box = mapEl.getBoundingClientRect();
    if (id === 'home') views.find = fitBox(MAP.home, mapEl.parentElement);
    else zoomAt({ x: box.left + box.width / 2, y: box.top + box.height / 2 }, id === 'in' ? 0.62 : 1.6);
    lastLabelW = 0;
    applyView();
  },
  pick: id => { if (!S.reservation) { S.pick = Number(id); buzz(10); renderScreen(); } },
  reserve: () => {
    const l = lot(S.lotId);
    if (!S.pick || takenSet(l).has(S.pick)) return;
    reserveSpot(l, S.pick);
  },
  quick: () => { const l = quickLot(); if (l) reserveSpot(l, gridOpen(l)[0]); },
  drive: () => go('drive'),
  sheet: id => {
    S.sheet = id;
    if (id === 'demo' && !S.seenDemo) { S.seenDemo = true; renderScreen(); }
    renderOverlay();
  },
  closesheet: () => { S.sheet = null; renderOverlay(); },
  backdrop: (_, e) => { if (e.target.classList.contains('sheet')) actions.closesheet(); },
  cancelres: () => { const n = S.reservation.spot; S.reservation = null; toast(`Spot ${n} is back in the open pool`); go('find'); },
  arrive: () => {
    const r = S.reservation;
    if (!r || r.arrived) return;
    r.arrived = true; r.arrivedSim = S.simMin;
    driveToken++;
    buzz([40, 60, 40]);
    notify('Arrival confirmed', `The sensor in spot ${r.spot} sees your car. You're parked.`);
    go('reserve');
  },
  leave: () => { S.reservation = null; toast('Thanks. The spot is open again'); go('find'); },
  skip: () => {
    if (!S.reservation || S.reservation.arrived) return;
    S.reservation.endsAt -= 5 * 60 * 1000;
    S.simMin += 5;               // five minutes pass on the campus clock too
    tick();
    const c = screenEl.querySelector('.clock');
    if (c) c.textContent = `${simClock()} ▾`;
    if (S.sheet === 'demo') renderOverlay();
  },
  reset: () => { S = freshState(); lastView = null; noteEl.innerHTML = ''; render(); },
  toggle: id => {
    const l = lot(id);
    l.closed = !l.closed;
    toast(l.closed ? `${l.name} is closed. Permit holders see it now` : `${l.name} is open again`);
    render();
  },
  addcar: () => { S.adding = true; renderScreen(); document.getElementById('plate').focus(); },
  canceladd: () => { S.adding = false; renderScreen(); },
  savecar: () => {
    const plate = document.getElementById('plate').value.trim().toUpperCase();
    const car = document.getElementById('car').value.trim();
    if (!plate) { document.getElementById('plate').focus(); return; }
    S.vehicles.push({ plate, car: car || 'Vehicle' }); S.adding = false; toast(`${plate} added to your permit`); render();
  },
  removecar: i => { const [v] = S.vehicles.splice(Number(i), 1); toast(`${v.plate} removed`); render(); },
  up: i => { i = Number(i); [S.preferred[i - 1], S.preferred[i]] = [S.preferred[i], S.preferred[i - 1]]; renderScreen(); },
  down: i => { i = Number(i); [S.preferred[i + 1], S.preferred[i]] = [S.preferred[i], S.preferred[i + 1]]; renderScreen(); },
};
phoneEl.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  actions[el.dataset.act](el.dataset.id, e);
  save();
});
phoneEl.addEventListener('input', e => {
  if (e.target.id !== 'sim') return;
  S.simMin = Number(e.target.value);
  document.getElementById('simtime').textContent = simClock();
  checkPick();
  if (S.view !== 'drive' && !mapBusy) renderScreen();
  save();
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 'r') { actions.reset(); save(); }
  if (k === 'f') { actions.skip(); save(); }
});

// ---------- things that happen on their own
function checkPick() {
  if (S.view !== 'lot' || !S.pick) return;
  if (takenSet(lot(S.lotId)).has(S.pick)) {
    notify(`Spot ${S.pick} was just taken`, 'Another driver reserved it first. Pick another open spot.');
    S.pick = null;
  }
}
function tick() {
  const r = S.reservation;
  if (!r || r.arrived) return;
  const left = remaining();
  if (left === 0) {
    S.reservation = null; S.sheet = 'expired'; driveToken++;
    if (S.signedIn && S.role === 'holder') { S.view = 'reserve'; render(); }
    save();
    return;
  }
  if (left <= 300 && !r.warned) {
    r.warned = true;
    notify('5 minutes left on your hold', `Spot ${r.spot} in ${lot(r.lotId).name} is held until ${simClock(r.simEnd)}.`);
  }
  const t = document.getElementById('timer'), bar = document.getElementById('bar');
  if (t) t.textContent = fmt(left);
  if (bar) { bar.setAttribute('stroke-dashoffset', ringOffset()); bar.classList.toggle('low', left <= 300); }
}
setInterval(tick, 1000);
setInterval(() => {
  S.simMin += 1;
  const c = screenEl.querySelector('.clock');
  if (c) c.textContent = `${simClock()} ▾`;
}, 60000);
// Other drivers come and go: nudge the counts, and the spots in the lot you are looking at.
setInterval(() => {
  if (!S.signedIn) return;
  const busy = S.lots.filter(l => openCount(l) > 0);
  if (busy.length) {
    const l = busy[Math.floor(Math.random() * busy.length)];
    l.jit = Math.max(-6, Math.min(6, l.jit + (Math.random() < 0.6 ? -1 : 1) * (1 + Math.floor(Math.random() * 2))));
  }
  const watched = S.view === 'lot' ? lot(S.lotId) : busy[Math.floor(Math.random() * busy.length)];
  if (watched && Math.random() < 0.7) watched.gj = Math.max(-2, Math.min(2, watched.gj + (Math.random() < 0.6 ? -1 : 1)));
  checkPick();
  if (['find', 'lot', 'util'].includes(S.view) && (!S.sheet || S.sheet === 'demo') && !S.adding && !mapBusy) renderScreen();
}, 3500);

load();
render();
</script>
</body>
</html>
